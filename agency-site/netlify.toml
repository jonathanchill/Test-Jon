# Netlify picks this up when the site's base directory is set to agency-site,
# or when the repo root is used and Netlify detects the file here.
[build]
  base = "agency-site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_SITE_URL = "https://oppositenumber.ai"

# PUBLIC_SITE_URL drives canonical links, Open Graph URLs and the sitemap.
# Override it per deploy context in the Netlify UI if you need a staging domain.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Canonical host: send the Netlify subdomain and www to the apex domain.
[[redirects]]
  from = "https://superlative-alfajores-c5cf7c.netlify.app/*"
  to = "https://oppositenumber.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.oppositenumber.ai/*"
  to = "https://oppositenumber.ai/:splat"
  status = 301
  force = true
